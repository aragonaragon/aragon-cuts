name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pwsh scripts/setup-ffmpeg.ps1
      - run: pnpm build
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  build-macos:
    name: macOS ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
          - name: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Build and verify bundled FFmpeg
        run: bash scripts/setup-ffmpeg-macos.sh
      - name: Smoke test video encoding
        shell: bash
        run: |
          ffmpeg_bin="src-tauri/binaries/ffmpeg-${{ matrix.target }}"
          "$ffmpeg_bin" -hide_banner -loglevel error \
            -f lavfi -i color=c=black:s=320x240:d=1 \
            -vf "drawtext=fontfile='/System/Library/Fonts/Supplemental/Arial Bold.ttf':text='Aragon Cuts':fontsize=18:x=10:y=10:text_shaping=1" \
            -c:v h264_videotoolbox -allow_sw 1 -b:v 12M -pix_fmt yuv420p -y "$RUNNER_TEMP/smoke.mp4"
          "src-tauri/binaries/ffprobe-${{ matrix.target }}" \
            -v error -select_streams v:0 -show_entries stream=codec_name \
            -of default=noprint_wrappers=1:nokey=1 "$RUNNER_TEMP/smoke.mp4" | grep -qx h264
      - run: pnpm build
      - run: pnpm tauri build --target ${{ matrix.target }} --bundles app
      - name: Bundle FFmpeg libraries and verify app
        run: bash scripts/bundle-ffmpeg-macos.sh ${{ matrix.target }}
      - name: Create DMG
        run: pnpm tauri bundle --target ${{ matrix.target }} --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \) -print0)
          if [ "${#assets[@]}" -ne 4 ]; then
            echo "Expected two Mac DMGs and two Windows installers; found ${#assets[@]}" >&2
            exit 1
          fi
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Aragon Cuts $TAG" \
            --notes-file RELEASE_NOTES.md
